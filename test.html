<!DOCTYPE html>
<html>
<head>
  <title>Discord Activity Test</title>
  <style>
    body {
      background: #111;
      color: #1eff00;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="status">Starting Discord SDK...</div>

  <script type="module">
    const status = document.getElementById("status");

    try {
      const { DiscordSDK } = await import("https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@2/+esm");

      const discordSdk = new DiscordSDK("1532302380237066271");

      await discordSdk.ready();

      status.innerHTML = `
        <h1>Discord Activity is working</h1>
        <p>SDK ready successfully</p>
      `;
    } catch (err) {
      status.innerHTML = `
        <h1 style="color:red">SDK Error</h1>
        <p>${err.message}</p>
      `;
      console.error(err);
    }
  </script>
</body>
</html>

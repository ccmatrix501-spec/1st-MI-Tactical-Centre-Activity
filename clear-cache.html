<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refreshing Tactical Centre</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #050607;
      color: #fff;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <h1>Refreshing Tactical Centre</h1>
    <p>Removing the old mobile build and cached files…</p>
  </div>
  <script>
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (e) {}
      location.replace("./?build=147");
    })();
  </script>
</body>
</html>

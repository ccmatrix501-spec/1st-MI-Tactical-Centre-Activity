<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clear Cache — 1st M.I. Tactical Centre</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#050607; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { text-align:center; padding:2rem; border:1px solid #1eff00; border-radius:12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Clearing cache…</h1>
    <p>Reloading the latest build.</p>
  </div>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) {}
      location.href = './?v=' + Date.now();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clear Tactical Centre Cache</title>
  <style>body{font-family:system-ui;background:#050607;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head>
<body>
  <div>Clearing Tactical Centre cache…</div>
  <script>
    (async()=>{
      try {
        if ('serviceWorker' in navigator) {
          for (const registration of await navigator.serviceWorker.getRegistrations()) {
            await registration.unregister();
          }
        }
        if ('caches' in window) {
          for (const key of await caches.keys()) await caches.delete(key);
        }
      } catch {}
      location.href = './?desktop=1.3.27&t=' + Date.now();
    })();
  </script>
</body>
</html>
